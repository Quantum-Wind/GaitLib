# Coverage gate for `./gradlew coverage` (and CI). Everything under src/main/native must be fully
# covered by the unit tests. Compiler-generated exception-unwinding branches can't be reached from a
# test, so they're excluded rather than counted against the library.
root = .
filter = src/main/native/
exclude-throw-branches = yes
exclude-unreachable-branches = yes
merge-lines = yes
print-summary = yes
html-details = build/reports/coverage/index.html
fail-under-line = 100
fail-under-function = 100
fail-under-branch = 100
