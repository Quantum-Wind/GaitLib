import edu.wpi.first.toolchain.*

plugins {
    id 'cpp'
    id 'google-test'
    id 'edu.wpi.first.wpilib.repositories.WPILibRepositoriesPlugin' version '2025.0'
    id 'edu.wpi.first.NativeUtils' version '2026.0.1'
    id 'edu.wpi.first.GradleVsCode' version '2.1.0'
}

group = gaitlibGroup
version = project.hasProperty('buildNumber')
        ? "${gaitlibVersionBase}.${project.property('buildNumber')}"
        : "${gaitlibVersionBase}-local"

repositories {
    mavenCentral()
}
wpilibRepositories.addAllReleaseRepositories(project)

// Toolchains, platforms, and WPILib dependency versions
apply from: 'config.gradle'

nativeUtils {
    exportsConfigs {
        // Export every symbol from the shared build (needed for Windows DLLs)
        GaitLib {
        }
    }
}

def desktopPlatform = NativePlatforms.desktop

model {
    components {
        GaitLib(NativeLibrarySpec) {
            sources {
                cpp {
                    source {
                        srcDirs 'src/main/native/cpp'
                        include '**/*.cpp'
                    }
                    exportedHeaders {
                        srcDirs 'src/main/native/include'
                    }
                }
            }
            nativeUtils.useRequiredLibrary(it, 'wpilib_shared')
        }
    }
    testSuites {
        // The google-test plugin creates GaitLibTest for the GaitLib component; this configures it.
        GaitLibTest {
            sources.cpp {
                source {
                    srcDir 'src/test/native/cpp'
                    include '**/*.cpp'
                }
            }

            binaries.all {
                // Only run the tests on the machine doing the build
                if (it.targetPlatform.name != desktopPlatform || it.buildType.name != 'debug') {
                    it.buildable = false
                }
            }

            nativeUtils.useRequiredLibrary(it, 'wpilib_executable_shared', 'googletest_static')
        }
    }
}

apply from: 'publish.gradle'

tasks.register('rootCompileCommands') {
    def src = layout.buildDirectory.file("TargetedCompileCommands/${desktopPlatform}debug/compile_commands.json")
    def dst = layout.projectDirectory.file('compile_commands.json')
    dependsOn 'generateCompileCommands'
    // Builds limited to cross targets (-Ponlylinuxathena etc.) have no desktop compile commands.
    onlyIf { src.get().asFile.exists() }
    inputs.files(src)
    outputs.file(dst)
    doLast {
        java.nio.file.Files.copy(src.get().asFile.toPath(), dst.asFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
tasks.named('build') { dependsOn 'rootCompileCommands' }

// Every source file has exactly one test file at the mirrored path:
//   src/main/native/cpp/sim/ModuleIOSim.cpp <-> src/test/native/cpp/sim/ModuleIOSimTest.cpp
// main.cpp (the GoogleTest entry point) is the only test file without a source.
def mainSourceDir = file('src/main/native/cpp')
def testSourceDir = file('src/test/native/cpp')
def checkTestMirror = tasks.register('checkTestMirror') {
    group = 'verification'
    description = 'Fails unless src/test/native/cpp mirrors src/main/native/cpp one-to-one.'
    inputs.dir(mainSourceDir)
    inputs.dir(testSourceDir)
    outputs.upToDateWhen { true }
    doLast {
        def relative = { File root -> fileTree(root) { include '**/*.cpp' }.files
                .collect { root.toPath().relativize(it.toPath()).toString().replace('\\', '/') } as Set }
        def expected = relative(mainSourceDir).collect { it.replaceAll(/\.cpp$/, 'Test.cpp') } as Set
        def actual = relative(testSourceDir) - 'main.cpp'
        def missing = (expected - actual).sort()
        def orphaned = (actual - expected).sort()
        if (missing || orphaned) {
            def lines = missing.collect { "  missing test:  src/test/native/cpp/$it" } +
                    orphaned.collect { "  orphaned test: src/test/native/cpp/$it (no matching source)" }
            throw new GradleException("Test tree does not mirror src/main/native/cpp:\n" + lines.join('\n'))
        }
    }
}
tasks.named('check') { dependsOn checkTestMirror }

// `./gradlew coverage` builds the desktop debug binaries with gcov instrumentation, runs the unit
// tests, and fails unless gcovr (settings in gcovr.cfg) reports 100% coverage of src/main/native.
// Instrumentation is only added when the coverage task is requested, so it never ships in a build.
def desktopTestRunTask = "runGaitLibTest${desktopPlatform.capitalize()}DebugGoogleTestExe"
def coverageRequested = gradle.startParameter.taskNames.any { it == 'coverage' || it.endsWith(':coverage') }
if (coverageRequested) {
    model {
        binaries {
            withType(NativeBinarySpec).all {
                if (it.targetPlatform.name == desktopPlatform && it.buildType.name == 'debug') {
                    it.cppCompiler.args '--coverage'
                    it.linker.args '--coverage'
                }
            }
        }
    }
}

tasks.register('coverage', Exec) {
    group = 'verification'
    description = 'Runs the unit tests with gcov and enforces 100% coverage (requires gcovr, Linux/GCC).'
    dependsOn checkTestMirror, tasks.matching { it.name == desktopTestRunTask }
    workingDir = projectDir
    commandLine 'gcovr', '--config', 'gcovr.cfg'
    doFirst { layout.buildDirectory.dir('reports/coverage').get().asFile.mkdirs() }
}

if (coverageRequested) {
    tasks.matching { it.name == desktopTestRunTask }.configureEach { runTask ->
        // Always rerun from zeroed counters so stale .gcda files can't inflate the result.
        runTask.outputs.upToDateWhen { false }
        runTask.doFirst {
            fileTree(layout.buildDirectory) { include '**/*.gcda' }.each { it.delete() }
        }
    }
}

wrapper {
    gradleVersion = '8.14.3'
}
