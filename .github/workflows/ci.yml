name: CI

# Pull requests build and test only. Every push to main also publishes a new version.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  # Linux targets build inside WPILib's toolchain containers.
  build-docker:
    needs: [validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: wpilib/roborio-cross-ubuntu:2025-22.04
            artifact-name: roborio
            build-options: -Ponlylinuxathena
          - container: wpilib/raspbian-cross-ubuntu:bookworm-22.04
            artifact-name: linuxarm32
            build-options: -Ponlylinuxarm32
          - container: wpilib/aarch64-cross-ubuntu:bookworm-22.04
            artifact-name: linuxarm64
            build-options: -Ponlylinuxarm64
          - container: wpilib/ubuntu-base:22.04
            artifact-name: linuxx86-64
            build-options: ''
    name: Build - ${{ matrix.artifact-name }}
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: ./gradlew build ${{ matrix.build-options }}
      - uses: actions/upload-artifact@v4
        with:
          name: gaitlib-${{ matrix.artifact-name }}
          path: build/outputs/*.zip

  # Unit tests must cover 100% of the library's lines, functions, and branches (see gcovr.cfg).
  coverage:
    needs: [validation]
    name: Coverage
    runs-on: ubuntu-22.04
    container: wpilib/ubuntu-base:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: python3 -m pip install gcovr==8.4
      - name: Enforce 100% coverage
        run: ./gradlew coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/coverage/

  # Windows (x86-64 + arm64) and macOS (universal, x86-64 + arm64 slices) build on native runners.
  build-host:
    needs: [validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          # native-utils skips windowsarm64 on an x86-64 host unless asked.
          - os: windows-2022
            artifact-name: windows
            architecture: x64
            build-options: -Pbuildwinarm64
          - os: macos-14
            artifact-name: macos
            architecture: aarch64
            build-options: ''
    name: Build - ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: 13.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          architecture: ${{ matrix.architecture }}
      - name: Build and test
        shell: bash
        run: ./gradlew build ${{ matrix.build-options }}
      - uses: actions/upload-artifact@v4
        with:
          name: gaitlib-${{ matrix.artifact-name }}
          path: build/outputs/*.zip

  # Pushes to main: combine every platform into one Maven publication,
  # com.quantumwind:gaitlib-cpp:<gaitlibVersionBase>.<run number>, add it to the public Maven repo
  # on the `maven` branch (served by GitHub Pages at https://quantum-wind.github.io/GaitLib), and
  # attach the matching GaitLib.json to a GitHub release.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-docker, build-host, coverage]
    name: Publish
    runs-on: ubuntu-22.04
    concurrency: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          pattern: gaitlib-*
          path: combined
          merge-multiple: true
      # Every platform WPILib 2026 publishes, in all four variants. Fail rather than publish
      # a version some robot/coprocessor/sim platform can't link.
      - name: Check every platform was built
        run: |
          missing=0
          for platform in linuxathena linuxarm32 linuxarm64 linuxx86-64 windowsx86-64 windowsarm64 osxuniversal; do
            for variant in "" debug static staticdebug; do
              f="combined/gaitlib-cpp-$platform$variant.zip"
              [ -f "$f" ] || { echo "::error::missing $f"; missing=1; }
            done
          done
          for extra in headers sources; do
            [ -f "combined/gaitlib-cpp-$extra.zip" ] || { echo "::error::missing gaitlib-cpp-$extra.zip"; missing=1; }
          done
          exit $missing
      # The `maven` branch holds every published version. The first run creates it.
      - name: Check out the Maven repo
        run: |
          if git fetch --depth=1 origin maven; then
            git worktree add -B maven maven-repo FETCH_HEAD
          else
            git worktree add --orphan -b maven maven-repo
          fi
          touch maven-repo/.nojekyll
      - name: Publish to the Maven repo
        run: >
          ./gradlew publishCppPublicationToSiteRepository vendordepJson
          -PcombinedDir="$GITHUB_WORKSPACE/combined"
          -PmavenRepoDir="$GITHUB_WORKSPACE/maven-repo"
          -PbuildNumber=${{ github.run_number }}
      - name: Push the Maven repo
        working-directory: maven-repo
        run: |
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "gaitlib-cpp ${{ github.run_number }} from ${GITHUB_SHA::7}"
          git push origin maven
      - name: Create release
        run: |
          json=build/generated/vendordep/GaitLib.json
          version=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['version'])" "$json")
          gh release create "v$version" "$json" --target "$GITHUB_SHA" --title "GaitLib $version" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
