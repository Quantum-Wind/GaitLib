# Library coordinates. Every push to main publishes <gaitlibVersionBase>.<CI run number>
# (CI passes -PbuildNumber); local builds are <gaitlibVersionBase>-local.
# Bump gaitlibVersionBase by hand for breaking changes.
gaitlibGroup=com.quantumwind
gaitlibVersionBase=0.1

# WPILib release the library is compiled against. Keep in sync with the robot project's GradleRIO version.
wpilibVersion=2026.2.1

org.gradle.jvmargs=-Xmx2g
